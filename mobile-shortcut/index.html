<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="소설 네비" />
  <title>웹소설 네비게이터 바로가기</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #4f46e5;
      --accent-2: #6366f1;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 40%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      padding: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 .75rem; font-size: 1.2rem; }
    p { margin: .4rem 0; color: var(--muted); line-height: 1.5; }
    .row { display: grid; gap: .5rem; margin: .9rem 0; }
    input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: #0b1220;
      color: var(--text);
      padding: .75rem .8rem;
      font-size: .95rem;
    }
    .btns { display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; }
    button {
      border: 0;
      border-radius: 12px;
      padding: .75rem .8rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #1f2937;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .status {
      margin-top: .8rem;
      font-size: .9rem;
      color: var(--ok);
      min-height: 1.2rem;
    }
    ol {
      margin: .75rem 0 0;
      padding-left: 1.1rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>📱 웹소설 네비게이터 바로가기</h1>
    <p>휴대폰 홈 화면에서 앱처럼 실행할 수 있는 바로가기 페이지입니다.</p>
    <p>한 번만 주소를 저장하면 이후에는 홈 화면 아이콘으로 바로 실행됩니다.</p>

    <div class="row">
      <label for="appUrl">Streamlit 앱 주소</label>
      <input id="appUrl" type="url" placeholder="https://YOUR-APP-URL" />
    </div>

    <div class="btns">
      <button id="saveBtn">주소 저장</button>
      <button id="openBtn" class="secondary">앱 열기</button>
    </div>

    <div class="status" id="status"></div>

    <ol>
      <li>앱 주소를 입력하고 <strong>주소 저장</strong>을 누르세요.</li>
      <li>브라우저 메뉴에서 <strong>홈 화면에 추가</strong>를 선택하세요.</li>
      <li>생성된 아이콘을 누르면 이 페이지를 거쳐 앱이 바로 열립니다.</li>
    </ol>
  </main>

  <script>
    const STORAGE_KEY = "story_navigator_app_url_v1";
    const input = document.getElementById("appUrl");
    const statusEl = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const queryUrl = params.get("url");
    const storedUrl = localStorage.getItem(STORAGE_KEY);

    function normalizeUrl(raw) {
      const value = String(raw || "").trim();
      if (!value) return "";
      if (/^https?:\/\//i.test(value)) return value;
      return `https://${value}`;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.style.color = isError ? "#fca5a5" : "#22c55e";
    }

    const initialUrl = normalizeUrl(queryUrl || storedUrl);
    if (initialUrl) {
      input.value = initialUrl;
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      const value = normalizeUrl(input.value);
      if (!value) {
        setStatus("앱 주소를 먼저 입력해주세요.", true);
        return;
      }
      localStorage.setItem(STORAGE_KEY, value);
      setStatus("주소가 저장되었습니다. 이제 홈 화면에 추가하세요.");
    });

    document.getElementById("openBtn").addEventListener("click", () => {
      const value = normalizeUrl(input.value || localStorage.getItem(STORAGE_KEY));
      if (!value) {
        setStatus("열 앱 주소가 없습니다. 주소를 저장해주세요.", true);
        return;
      }
      window.location.href = value;
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
