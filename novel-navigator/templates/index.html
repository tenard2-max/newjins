<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="웹소설 스토리 바이블 네비게이터 — Constitution v1.0">
  <title>스토리 네비게이터</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="top-bar__brand">
        <span class="pulse-dot"></span>
        <h1>스토리 네비게이터</h1>
      </div>
      <div class="top-bar__meta" id="storyStatus">EP001~EP007</div>
    </header>

    <main class="main-content" id="mainContent">
      <!-- 홈 -->
      <section class="panel active" id="panel-home" data-panel="home">
        <div class="balance-card glass">
          <div class="balance-card__label">통장 잔고</div>
          <div class="balance-card__amount" id="balanceAmount">58.7억</div>
          <div class="balance-card__sub">Seed 단계 · AI 매매 전담</div>
        </div>
        <div class="stat-grid">
          <div class="stat-card glass">
            <span class="stat-card__num" id="charCount">6</span>
            <span class="stat-card__label">인물</span>
          </div>
          <div class="stat-card glass">
            <span class="stat-card__num" id="issueCount">4</span>
            <span class="stat-card__label">중요 이슈</span>
          </div>
          <div class="stat-card glass">
            <span class="stat-card__num" id="enemyCount">9</span>
            <span class="stat-card__label">적/위협</span>
          </div>
          <div class="stat-card glass">
            <span class="stat-card__num" id="epDone">7/8</span>
            <span class="stat-card__label">에피소드</span>
          </div>
        </div>
        <h2 class="section-title">에피소드 진행</h2>
        <div class="episode-list" id="episodeList"></div>
        <h2 class="section-title">세계관 핵심</h2>
        <div class="world-card glass" id="worldSummary"></div>
      </section>

      <!-- 인물 -->
      <section class="panel" id="panel-characters" data-panel="characters">
        <h2 class="section-title">인물 선택</h2>
        <div class="char-chips" id="charChips"></div>
        <div class="char-detail glass" id="charDetail"></div>
        <h2 class="section-title">인물 관계도</h2>
        <div class="relation-wrap glass">
          <svg id="relationGraph" viewBox="0 0 360 320" aria-label="인물 관계도"></svg>
        </div>
        <div class="relation-legend" id="relationLegend"></div>
      </section>

      <!-- 이슈·투자·적 -->
      <section class="panel" id="panel-intel" data-panel="intel">
        <h2 class="section-title">중요 이슈 (떡밥)</h2>
        <div class="issue-list" id="issueList"></div>
        <h2 class="section-title">투자 목록</h2>
        <div class="invest-list" id="investList"></div>
        <h2 class="section-title">적 리스트</h2>
        <div class="enemy-list" id="enemyList"></div>
        <h2 class="section-title">게이트 정보</h2>
        <div class="gate-card glass" id="gateInfo"></div>
      </section>

      <!-- 스토리·편집 -->
      <section class="panel" id="panel-story" data-panel="story">
        <h2 class="section-title">스토리 파일</h2>
        <div class="file-tabs" id="fileTabs"></div>
        <textarea class="editor glass" id="fileEditor" spellcheck="false" placeholder="파일을 선택하세요"></textarea>
        <div class="editor-actions">
          <button type="button" class="btn btn-primary" id="btnSaveFile">저장</button>
          <button type="button" class="btn btn-outline" id="btnReloadFile">되돌리기</button>
        </div>
        <div class="export-row">
          <button type="button" class="btn btn-primary" id="btnExportZip">story_bible.zip 보내기</button>
          <label class="btn btn-outline import-label">
            ZIP 가져오기
            <input type="file" id="importZip" accept=".zip" hidden>
          </label>
        </div>
        <button type="button" class="btn btn-outline btn-block" id="btnRegenMaster">Master DB 동기화</button>
      </section>

      <!-- 설정 -->
      <section class="panel" id="panel-settings" data-panel="settings">
        <h2 class="section-title">Story Bible Project Constitution v1.0</h2>
        <div class="constitution-list" id="constitutionList"></div>
        <h2 class="section-title">잔고 조정</h2>
        <div class="balance-edit glass">
          <label for="balanceInput">현재 잔고 (억)</label>
          <input type="number" id="balanceInput" step="0.1" min="0" value="58.7">
          <button type="button" class="btn btn-primary btn-block" id="btnSaveBalance">잔고 저장</button>
        </div>
        <div class="meta-info glass" id="metaInfo"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="메인 메뉴">
      <button type="button" class="nav-item active" data-target="home" aria-label="홈">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/></svg>
        <span>홈</span>
      </button>
      <button type="button" class="nav-item" data-target="characters" aria-label="인물">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>인물</span>
      </button>
      <button type="button" class="nav-item" data-target="intel" aria-label="정보">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>정보</span>
      </button>
      <button type="button" class="nav-item" data-target="story" aria-label="스토리">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        <span>스토리</span>
      </button>
      <button type="button" class="nav-item" data-target="settings" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>설정</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="/static/js/app.js" type="module"></script>
</body>
</html>
