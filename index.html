<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StoryBible">
  <title>웹소설 네비게이터 · Story Bible</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/app.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-title">
      <span class="dot"></span>
      <span>STORY BIBLE · NAVIGATOR</span>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="topbar-balance-btn" title="현재 통장 잔고" data-view="investment">💰 <span id="topbar-balance">-</span></button>
      <button class="topbar-btn" data-view="story" title="스토리·에피소드">📖</button>
      <button class="topbar-btn" data-view="settings" title="설정·Import/Export">⚙️</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" role="navigation" aria-label="주요 메뉴">
    <button data-view="home" aria-label="홈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>홈</span>
    </button>
    <button data-view="characters" aria-label="인물">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 22c1-4 5-6 7-6s6 2 7 6"/><circle cx="17" cy="6" r="3"/><path d="M14 20c.5-2.5 3-4 5-4s4 1.5 4 4"/></svg>
      <span>인물</span>
    </button>
    <button data-view="relations" aria-label="관계도">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 4M17 7l-3 4M7 17l3-4M17 17l-3-4"/></svg>
      <span>관계도</span>
    </button>
    <button data-view="issues" aria-label="이슈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14"/><circle cx="12" cy="20" r="1.2" fill="currentColor"/></svg>
      <span>이슈</span>
    </button>
    <button data-view="investment" aria-label="투자">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
      <span>투자</span>
    </button>
    <button data-view="enemies" aria-label="적">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l7 3 7-3v9c0 4-4 7-7 7s-7-3-7-7z"/><path d="M9 11l6 4M15 11l-6 4"/></svg>
      <span>적</span>
    </button>
  </nav>

  <!-- 서브 진입점: 스토리·설정은 홈 대시보드/설정 버튼으로도 접근 가능하지만 하단 탭 6개를 유지하려고 여기에 숨김 탭으로 등록 -->
  <div style="display:none">
    <button data-view="story"></button>
    <button data-view="settings"></button>
  </div>

  <!-- 인물 상세 모달 -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-back" id="modal-back"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="grip"></div>
      <button class="modal-close" id="modal-close" aria-label="닫기">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 홈에서 접근할 수 있도록 상단 우측에 스토리/설정 아이콘 추가 대신 하단 탭 확장 필요 -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
